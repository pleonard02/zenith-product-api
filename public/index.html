<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif+Caption:ital@0;1&display=swap" rel="stylesheet">
    <title>Zenith Product API</title>
</head>
<body>
    <header class="bg-[linear-gradient(135deg,#EAF7F5,#08C7A1,#087D9D)] px-6 py-4">
        <div class="max-w-7xl mx-auto">
            <img src="./images/zenith_logo.png" alt="Zenith" class="w-[280px]">
        </div>

    </header>

    <main class="bg-[#f7fafa]">
        <section class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-[#031C2B] text-2xl font-semibold">Product Inventory</h1>
                <p class="text-[#65767b]">Manage the Zenith product catalog</p>
            </div>
            
            <button 
                id="add-product-btn" 
                class="bg-[linear-gradient(135deg,#087D9D,#08C7A1,#20E66B)]
                border border-[#06354A]
                px-5 py-2.5
                rounded-lg
                text-white font-semibold
                shadow-md
                hover:scale-105
                transition-transform"
            >
                Add Product
            </button>
            <section 
                class="
                    search-container
                    w-full
                    mt-8
                    p-4
                    flex
                    gap-4
                    items-center
                    bg-[linear-gradient(135deg,#EAF7F5,#08C7A1,#087D9D)]
                    border
                    border-[#06354A]
                    rounded-lg
                "
            >
                <input 
                    type="search"
                    placeholder="Search..."
                    class="
                        h-10
                        bg-white
                        flex-1
                        px-3
                        border
                        border-[#06354A]
                        rounded-lg
                        text-[#031c2b]
                    "
                />
                <select 
                    class="h-10 
                    px-3 border 
                    border-[#06354A] 
                    rounded-lg"
                >
                    <option>Category</option>
                </select>

                <select 
                    class="h-10 
                    px-3 
                    border 
                    border-[#06354A] 
                    rounded-lg"
                >
                    <option>Sort By</option>
                </select>
            </section>
        </section>
        <section class="products">

        </section>
    </main>
</body>
</html>
